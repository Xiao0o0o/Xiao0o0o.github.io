<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lb-btn lb-close" type="button" aria-label="Close">&times;</button>
  <button class="lb-btn lb-prev" type="button" aria-label="Previous photo">&#8249;</button>
  <figure>
    <img alt="">
    <figcaption></figcaption>
  </figure>
  <button class="lb-btn lb-next" type="button" aria-label="Next photo">&#8250;</button>
</div>
<script>
  (function () {
    var box = document.getElementById('lightbox');
    var img = box.querySelector('img');
    var cap = box.querySelector('figcaption');
    var items = [], idx = 0;

    function visible() {
      return Array.prototype.filter.call(document.querySelectorAll('[data-lightbox]'), function (a) {
        return !a.closest('[hidden]');
      });
    }
    function show(i) {
      idx = (i + items.length) % items.length;
      img.src = items[idx].getAttribute('href');
      cap.textContent = items[idx].getAttribute('data-caption') || '';
    }
    function close() { box.hidden = true; document.body.style.overflow = ''; img.src = ''; }

    document.addEventListener('click', function (e) {
      var a = e.target.closest('[data-lightbox]');
      if (!a) return;
      e.preventDefault();
      items = visible();
      box.hidden = false;
      document.body.style.overflow = 'hidden';
      show(items.indexOf(a));
    });
    box.querySelector('.lb-close').addEventListener('click', close);
    box.querySelector('.lb-prev').addEventListener('click', function () { show(idx - 1); });
    box.querySelector('.lb-next').addEventListener('click', function () { show(idx + 1); });
    box.addEventListener('click', function (e) { if (e.target === box) close(); });
    document.addEventListener('keydown', function (e) {
      if (box.hidden) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') show(idx - 1);
      if (e.key === 'ArrowRight') show(idx + 1);
    });
  })();
</script>
